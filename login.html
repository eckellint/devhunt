<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Eckellin</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-page{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    position: relative;
    overflow:hidden;
  }
  .login-page .hero-blob{ position:absolute; }
  .login-card{
    position:relative;
    z-index:1;
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    box-shadow: var(--shadow);
  }
  .login-card .back{
    font-size:0.85rem;
    color: var(--muted);
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom: 22px;
  }
  .login-card h1{ font-size: 1.7rem; margin-bottom:6px; }
  .login-card .sub{ color: var(--muted); font-size:0.92rem; margin-bottom:28px; }
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input{
    width:100%;
    padding: 13px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s ease;
  }
  .field input:focus{ border-color: var(--lime); }
  .login-actions{ margin-top: 26px; }
  .login-actions .btn{ width:100%; justify-content:center; }
  .login-note{
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--muted);
    text-align:center;
    line-height:1.5;
  }
  .form-msg{
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    display:none;
  }
  .form-msg.show{ display:block; }
  .form-msg.error{ background: rgba(255,106,77,0.15); color: var(--coral); }
  .form-msg.info{ background: rgba(139,92,246,0.15); color: var(--purple); }
  .theme-toggle-fixed{
    position: fixed;
    top: 20px; right: 20px;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="login-page">
  <div class="hero-blob blob-1"></div>
  <div class="hero-blob blob-2"></div>

  <button class="theme-toggle theme-toggle-fixed" id="themeToggle" aria-label="Changer de thème">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <div class="login-card">
    <a href="index.html" class="back">← Retour au portfolio</a>
    <h1>Connexion</h1>
    <p class="sub">Connectez-vous pour approfondir mes compétences et accéder à plus de contenu.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="loginForm" action="http://localhost:3000/login" method="POST">
      <div class="field">
        <label for="username">Nom d'utilisateur ou email</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="login-actions">
        <button type="submit" class="btn btn-primary" id="loginBtn">Se connecter</button>
      </div>
    </form>

    <p class="login-note">
      Cette page envoie une requête vers <code>/api/login</code>.<br>
      Branchez-y votre backend pour activer l'authentification.
    </p>
  </div>
</div>
